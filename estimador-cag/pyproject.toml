[project]
name = "estimador-cag"
version = "0.1.0"
description = "Estimador de proyectos de software con CAG"
readme = "README.md"
authors = [
    { name = "Hernán Feliú", email = "hernan.feliu.a@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0.0",
    "fastapi>=0.158.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.1",
    "pypdf>=7.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "streamlit>=1.66.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

